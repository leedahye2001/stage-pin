spring:
  datasource:
    # Use the IPv4 Session pooler (5432), not the transaction pooler (6543).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      schema: stagepin
      maximum-pool-size: 3
      minimum-idle: 0
  jpa:
    properties:
      hibernate:
        default_schema: stagepin
  flyway:
    default-schema: stagepin
    schemas: stagepin
    create-schemas: true
