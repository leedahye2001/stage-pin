spring:
  application:
    name: stage-pin-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stagepin}
    username: ${DB_USERNAME:stagepin}
    password: ${DB_PASSWORD:stagepin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

