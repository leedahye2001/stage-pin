spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0
    retry:
      max-attempts: 1
  application:
    name: stage-pin-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stagepin}
    username: ${DB_USERNAME:stagepin}
    password: ${DB_PASSWORD:stagepin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

kopis:
  api-key: ${KOPIS_API_KEY:}

naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

stagepin:
  admin-key: ${STAGEPIN_ADMIN_KEY:}
