services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stagepin}
      POSTGRES_USER: ${POSTGRES_USER:-stagepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stagepin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stagepin-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stagepin}
      DB_USERNAME: ${POSTGRES_USER:-stagepin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stagepin}
      KOPIS_API_KEY: ${KOPIS_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      STAGEPIN_ADMIN_KEY: ${STAGEPIN_ADMIN_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,https://*.vercel.app
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  stagepin-postgres:
