name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      auth-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stagepin_auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d stagepin_auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/stagepin_auth_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint -- --no-cache
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npx expo-doctor
